  // +patchStrategy=merge
  // +patchMergeKey=name
  repeated .k8s.io.api.core.v1.LocalObjectReference imagePullSecrets = 13 [(gogoproto.customname) = "ImagePullSecrets", (gogoproto.nullable) = false];

  // Host networking requested for this workflow pod. Default to false.
  optional bool hostNetwork = 14 [(gogoproto.customname) = "HostNetwork"];

  // Set DNS policy for workflow pods.
  // Defaults to "ClusterFirst".
