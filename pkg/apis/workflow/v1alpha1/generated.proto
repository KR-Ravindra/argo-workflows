// DAGTask represents a node in the graph during DAG execution
// Note: CEL validation cannot check withItems (Schemaless) or inline (PreserveUnknownFields) fields.
// +kubebuilder:validation:XValidation:rule="!has(self.depends) || !has(self.dependencies)",message="cannot use both 'depends' and 'dependencies'"
// +kubebuilder:validation:XValidation:rule="!has(self.depends) || !has(self.continueOn)",message="cannot use 'continueOn' when using 'depends'"
// +kubebuilder:validation:XValidation:rule="!(has(self.depends) || has(self.dependencies)) || !self.name.matches('^[0-9]')",message="task name cannot begin with a digit when using 'depends' or 'dependencies'"
message DAGTask {
  // Name is the name of the target
  // +kubebuilder:validation:MaxLength=128
  // +kubebuilder:validation:Pattern=`^[a-zA-Z0-9][-a-zA-Z0-9]*$`
  optional string name = 1 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Name of template to execute
  optional string template = 2 [(gogoproto.customname) = "Template", (gogoproto.nullable) = false];

  // Inline is the template. Template must be empty if this is declared (and vice-versa).
  // Note: As mentioned in the corresponding definition in WorkflowStep, this struct is defined recursively,
  // so we need "x-kubernetes-preserve-unknown-fields: true" in the validation schema.
  // +kubebuilder:pruning:PreserveUnknownFields
  optional Template inline = 14 [(gogoproto.customname) = "Inline"];

  // Arguments are the parameter and artifact arguments to the template
  optional Arguments arguments = 3 [(gogoproto.customname) = "Arguments", (gogoproto.nullable) = false];

  // TemplateRef is the reference to the template resource to execute.
  optional TemplateRef templateRef = 4 [(gogoproto.customname) = "TemplateRef"];

  // Dependencies are name of other targets which this depends on
  repeated string dependencies = 5 [(gogoproto.customname) = "Dependencies"];

  // WithItems expands a task into multiple parallel tasks from the items in the list
  // Note: The structure of WithItems is free-form, so we need
  // "x-kubernetes-preserve-unknown-fields: true" in the validation schema.
  // +kubebuilder:validation:Schemaless
  // +kubebuilder:pruning:PreserveUnknownFields
  repeated Item withItems = 6 [(gogoproto.customname) = "WithItems", (gogoproto.nullable) = false];

  // WithParam expands a task into multiple parallel tasks from the value in the parameter,
  // which is expected to be a JSON list.
  optional string withParam = 7 [(gogoproto.customname) = "WithParam", (gogoproto.nullable) = false];

  // WithSequence expands a task into a numeric sequence
  optional Sequence withSequence = 8 [(gogoproto.customname) = "WithSequence"];

  // When is an expression in which the task should conditionally execute
  optional string when = 9 [(gogoproto.customname) = "When", (gogoproto.nullable) = false];

  // ContinueOn makes argo to proceed with the following step even if this step fails.
  // Errors and Failed states can be specified
  optional ContinueOn continueOn = 10 [(gogoproto.customname) = "ContinueOn"];

  // OnExit is a template reference which is invoked at the end of the
  // template, irrespective of the success, failure, or error of the
  // primary template.
  //
  // Deprecated: Use Hooks[exit].Template instead.
  optional string onExit = 11 [(gogoproto.customname) = "OnExit", (gogoproto.nullable) = false];

  // Depends are name of other targets which this depends on
  optional string depends = 12 [(gogoproto.customname) = "Depends", (gogoproto.nullable) = false];

  // Hooks hold the lifecycle hook which is invoked at lifecycle of
  // task, irrespective of the success, failure, or error status of the primary task
  map<string, LifecycleHook> hooks = 13 [(gogoproto.castkey) = "LifecycleEvent", (gogoproto.casttype) = "LifecycleHooks", (gogoproto.customname) = "Hooks", (gogoproto.nullable) = false];
}

// DAGTemplate is a template subtype for directed acyclic graph templates
message DAGTemplate {
  // Target are one or more names of targets to execute in a DAG
  optional string target = 1 [(gogoproto.customname) = "Target", (gogoproto.nullable) = false];

  // Tasks are a list of DAG tasks
  // MaxItems is an artificial limit to limit CEL validation costs - see note at top of file
  // +patchStrategy=merge
  // +patchMergeKey=name
  // +kubebuilder:validation:MinItems=1
  // +kubebuilder:validation:MaxItems=200
  repeated DAGTask tasks = 2 [(gogoproto.customname) = "Tasks", (gogoproto.nullable) = false];

  // This flag is for DAG logic. The DAG logic has a built-in "fail fast" feature to stop scheduling new steps,
  // as soon as it detects that one of the DAG nodes is failed. Then it waits until all DAG nodes are completed
  // before failing the DAG itself.
  // The FailFast flag default is true,  if set to false, it will allow a DAG to run all branches of the DAG to
  // completion (either success or failure), regardless of the failed outcomes of branches in the DAG.
  // More info and example about this feature at https://github.com/argoproj/argo-workflows/issues/1442
  optional bool failFast = 3 [(gogoproto.customname) = "FailFast"];
}

