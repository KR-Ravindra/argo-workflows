  map<string, LifecycleHook> hooks = 41 [(gogoproto.castkey) = "LifecycleEvent", (gogoproto.casttype) = "LifecycleHooks", (gogoproto.customname) = "Hooks", (gogoproto.nullable) = false];

  // WorkflowMetadata contains some metadata of the workflow to refer to
  optional WorkflowMetadata workflowMetadata = 42 [(gogoproto.customname) = "WorkflowMetadata"];

  // ArtifactGC describes the strategy to use when deleting artifacts from completed or deleted workflows (applies to all output Artifacts
  // unless Artifact.ArtifactGC is specified, which overrides this)
  optional WorkflowLevelArtifactGC artifactGC = 43 [(gogoproto.customname) = "ArtifactGC"];

  // Specifies executor plugins at the workflow level.
