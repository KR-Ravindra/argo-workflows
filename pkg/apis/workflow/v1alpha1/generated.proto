  optional string dnsPolicy = 15 [(gogoproto.casttype) = "k8s.io/api/core/v1.DNSPolicy", (gogoproto.customname) = "DNSPolicy"];

  // PodDNSConfig defines the DNS parameters of a pod in addition to
  // those generated from DNSPolicy.
  optional .k8s.io.api.core.v1.PodDNSConfig dnsConfig = 16 [(gogoproto.customname) = "DNSConfig"];

  // OnExit is a template reference which is invoked at the end of the
  // workflow, irrespective of the success, failure, or error of the
  // primary workflow.
  optional string onExit = 17 [(gogoproto.customname) = "OnExit", (gogoproto.nullable) = false];

  // TTLStrategy limits the lifetime of a Workflow that has finished execution depending on if it
  // Succeeded or Failed. If this struct is set, once the Workflow finishes, it will be
