// WorkflowStatus contains overall status information about a workflow
message WorkflowStatus {
  // Phase a simple, high-level summary of where the workflow is in its lifecycle.
  // Will be "" (Unknown), "Pending", or "Running" before the workflow is completed, and "Succeeded",
  // "Failed" or "Error" once the workflow has completed.
  optional string phase = 1 [(gogoproto.casttype) = "WorkflowPhase", (gogoproto.customname) = "Phase", (gogoproto.nullable) = false];

  // Time at which this workflow started
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time startedAt = 2 [(gogoproto.customname) = "StartedAt", (gogoproto.nullable) = false];

  // Time at which this workflow completed
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time finishedAt = 3 [(gogoproto.customname) = "FinishedAt", (gogoproto.nullable) = false];

  // EstimatedDuration in seconds.
  optional int64 estimatedDuration = 16 [(gogoproto.casttype) = "EstimatedDuration", (gogoproto.customname) = "EstimatedDuration", (gogoproto.nullable) = false];

  // Progress to completion
  optional string progress = 17 [(gogoproto.casttype) = "Progress", (gogoproto.customname) = "Progress", (gogoproto.nullable) = false];

  // A human readable message indicating details about why the workflow is in this condition.
  optional string message = 4 [(gogoproto.customname) = "Message", (gogoproto.nullable) = false];

  // Compressed and base64 decoded Nodes map
  optional string compressedNodes = 5 [(gogoproto.customname) = "CompressedNodes", (gogoproto.nullable) = false];

  // Nodes is a mapping between a node ID and the node's status.
  map<string, NodeStatus> nodes = 6 [(gogoproto.casttype) = "Nodes", (gogoproto.customname) = "Nodes", (gogoproto.nullable) = false];

  // Whether on not node status has been offloaded to a database. If exists, then Nodes and CompressedNodes will be empty.
  // This will actually be populated with a hash of the offloaded data.
  optional string offloadNodeStatusVersion = 10 [(gogoproto.customname) = "OffloadNodeStatusVersion", (gogoproto.nullable) = false];

  // StoredTemplates is a mapping between a template ref and the node's status.
  map<string, Template> storedTemplates = 9 [(gogoproto.customname) = "StoredTemplates", (gogoproto.nullable) = false];

  // PersistentVolumeClaims tracks all PVCs that were created as part of the workflow.
  // The contents of this list are drained at the end of the workflow.
  repeated .k8s.io.api.core.v1.Volume persistentVolumeClaims = 7 [(gogoproto.customname) = "PersistentVolumeClaims", (gogoproto.nullable) = false];

  // Outputs captures output values and artifact locations produced by the workflow via global outputs
  optional Outputs outputs = 8 [(gogoproto.customname) = "Outputs"];

  // Conditions is a list of conditions the Workflow may have
  repeated Condition conditions = 13 [(gogoproto.customname) = "Conditions", (gogoproto.nullable) = false];

  // ResourcesDuration is the total for the workflow
  map<string, int64> resourcesDuration = 12 [(gogoproto.castkey) = "k8s.io/api/core/v1.ResourceName", (gogoproto.casttype) = "ResourcesDuration", (gogoproto.castvalue) = "ResourceDuration", (gogoproto.customname) = "ResourcesDuration", (gogoproto.nullable) = false];

  // StoredWorkflowSpec stores the WorkflowTemplate spec for future execution.
  optional WorkflowSpec storedWorkflowTemplateSpec = 14 [(gogoproto.customname) = "StoredWorkflowSpec"];

  // Synchronization stores the status of synchronization locks
  optional SynchronizationStatus synchronization = 15 [(gogoproto.customname) = "Synchronization"];

  // ArtifactRepositoryRef is used to cache the repository to use so we do not need to determine it everytime we reconcile.
  optional ArtifactRepositoryRefStatus artifactRepositoryRef = 18 [(gogoproto.customname) = "ArtifactRepositoryRef"];

  // ArtifactGCStatus maintains the status of Artifact Garbage Collection
  optional ArtGCStatus artifactGCStatus = 19 [(gogoproto.customname) = "ArtifactGCStatus"];

  // TaskResultsCompletionStatus tracks task result completion status (mapped by node ID). Used to prevent premature archiving and garbage collection.
  map<string, bool> taskResultsCompletionStatus = 20 [(gogoproto.customname) = "TaskResultsCompletionStatus", (gogoproto.nullable) = false];
}

// WorkflowStep is a reference to a template to execute in a series of step
// Note: CEL validation cannot check withItems (Schemaless) or inline (PreserveUnknownFields) fields.
message WorkflowStep {
  // Name of the step
  // +kubebuilder:validation:MaxLength=128
  // +kubebuilder:validation:Pattern=`^[a-zA-Z0-9][-a-zA-Z0-9]*$`
  optional string name = 1 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Template is the name of the template to execute as the step
  optional string template = 2 [(gogoproto.customname) = "Template", (gogoproto.nullable) = false];

  // Inline is the template. Template must be empty if this is declared (and vice-versa).
  // Note: This struct is defined recursively, since the inline template can potentially contain
  // steps/DAGs that also has an "inline" field. Kubernetes doesn't allow recursive types, so we
  // need "x-kubernetes-preserve-unknown-fields: true" in the validation schema.
  // +kubebuilder:pruning:PreserveUnknownFields
  optional Template inline = 13 [(gogoproto.customname) = "Inline"];

  // Arguments hold arguments to the template
  optional Arguments arguments = 3 [(gogoproto.customname) = "Arguments", (gogoproto.nullable) = false];

  // TemplateRef is the reference to the template resource to execute as the step.
  optional TemplateRef templateRef = 4 [(gogoproto.customname) = "TemplateRef"];

  // WithItems expands a step into multiple parallel steps from the items in the list
  // Note: The structure of WithItems is free-form, so we need
  // "x-kubernetes-preserve-unknown-fields: true" in the validation schema.
  // +kubebuilder:validation:Schemaless
  // +kubebuilder:pruning:PreserveUnknownFields
  repeated Item withItems = 5 [(gogoproto.customname) = "WithItems", (gogoproto.nullable) = false];

  // WithParam expands a step into multiple parallel steps from the value in the parameter,
  // which is expected to be a JSON list.
  optional string withParam = 6 [(gogoproto.customname) = "WithParam", (gogoproto.nullable) = false];

  // WithSequence expands a step into a numeric sequence
  optional Sequence withSequence = 7 [(gogoproto.customname) = "WithSequence"];

  // When is an expression in which the step should conditionally execute
  optional string when = 8 [(gogoproto.customname) = "When", (gogoproto.nullable) = false];

  // ContinueOn makes argo to proceed with the following step even if this step fails.
  // Errors and Failed states can be specified
  optional ContinueOn continueOn = 9 [(gogoproto.customname) = "ContinueOn"];

  // OnExit is a template reference which is invoked at the end of the
  // template, irrespective of the success, failure, or error of the
  // primary template.
  //
  // Deprecated: Use Hooks[exit].Template instead.
  optional string onExit = 11 [(gogoproto.customname) = "OnExit", (gogoproto.nullable) = false];

  // Hooks holds the lifecycle hook which is invoked at lifecycle of
  // step, irrespective of the success, failure, or error status of the primary step
  map<string, LifecycleHook> hooks = 12 [(gogoproto.castkey) = "LifecycleEvent", (gogoproto.casttype) = "LifecycleHooks", (gogoproto.customname) = "Hooks", (gogoproto.nullable) = false];
}

// WorkflowTaskResult is a used to communicate a result back to the controller. Unlike WorkflowTaskSet, it has
