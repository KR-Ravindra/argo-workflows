  map<string, string> nodeSelector = 10 [(gogoproto.customname) = "NodeSelector", (gogoproto.nullable) = false];

  // Affinity sets the scheduling constraints for all pods in the workflow.
  // Can be overridden by an affinity specified in the template
  optional .k8s.io.api.core.v1.Affinity affinity = 11 [(gogoproto.customname) = "Affinity"];

  // Tolerations to apply to workflow pods.
  // +patchStrategy=merge
  // +patchMergeKey=key
  repeated .k8s.io.api.core.v1.Toleration tolerations = 12 [(gogoproto.customname) = "Tolerations", (gogoproto.nullable) = false];

  // ImagePullSecrets is a list of references to secrets in the same namespace to use for pulling any images
