message ManifestFrom {
  // Artifact contains the artifact to use
  optional Artifact artifact = 1 [(gogoproto.customname) = "Artifact"];
}

// MemoizationStatus is the status of this memoized node
message MemoizationStatus {
  // Hit indicates whether this node was created from a cache entry
  optional bool hit = 1 [(gogoproto.customname) = "Hit", (gogoproto.nullable) = false];

  // Key is the name of the key used for this node's cache
  optional string key = 2 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];

  // Cache is the name of the cache that was used
  optional string cacheName = 3 [(gogoproto.customname) = "CacheName", (gogoproto.nullable) = false];
}

// Memoize enables caching for the Outputs of the template.
message Memoize {
  // Key is the key to use as the caching key
  optional string key = 1 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];

  // Cache sets and configures the kind of cache
  optional Cache cache = 2 [(gogoproto.customname) = "Cache"];

  // MaxAge is the maximum age (e.g. "180s", "24h") of an entry that is still considered valid. If an entry is older
  // than the MaxAge, it will be ignored.
  optional string maxAge = 3 [(gogoproto.customname) = "MaxAge", (gogoproto.nullable) = false];
}

// Metadata is pod metadata.
message Metadata {
  map<string, string> annotations = 1 [(gogoproto.customname) = "Annotations", (gogoproto.nullable) = false];

  map<string, string> labels = 2 [(gogoproto.customname) = "Labels", (gogoproto.nullable) = false];
}

// MetricLabel is a single label for a prometheus metric
message MetricLabel {
  // +kubebuilder:validation:Pattern=`^[a-zA-Z_][a-zA-Z0-9_]*$`
  optional string key = 1 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];

  optional string value = 2 [(gogoproto.customname) = "Value", (gogoproto.nullable) = false];
}

// Metrics are a list of metrics emitted from a Workflow/Template
message Metrics {
  // Prometheus is a list of prometheus metrics to be emitted
  // MaxItems is an artificial limit to limit CEL validation costs - see note at top of file
  // +kubebuilder:validation:MaxItems=100
  repeated Prometheus prometheus = 1 [(gogoproto.customname) = "Prometheus"];
}

// Mutex holds Mutex configuration
message Mutex {
  // name of the mutex
  optional string name = 1 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Namespace is the namespace of the mutex, default: [namespace of workflow]
  optional string namespace = 2 [(gogoproto.customname) = "Namespace", (gogoproto.nullable) = false];

  // Database specifies this is database controlled if this is set true
  optional bool database = 3 [(gogoproto.customname) = "Database", (gogoproto.nullable) = false];
}

// MutexHolding describes the mutex and the object which is holding it.
message MutexHolding {
  // Reference for the mutex
  // e.g: ${namespace}/mutex/${mutexName}
  optional string mutex = 1 [(gogoproto.customname) = "Mutex", (gogoproto.nullable) = false];

  // Holder is a reference to the object which holds the Mutex.
  // Holding Scenario:
  //   1. Current workflow's NodeID which is holding the lock.
  //      e.g: ${NodeID}
  // Waiting Scenario:
  //   1. Current workflow or other workflow NodeID which is holding the lock.
  //      e.g: ${WorkflowName}/${NodeID}
  optional string holder = 2 [(gogoproto.customname) = "Holder", (gogoproto.nullable) = false];
}

// MutexStatus contains which objects hold  mutex locks, and which objects this workflow is waiting on to release locks.
message MutexStatus {
  // Holding is a list of mutexes and their respective objects that are held by mutex lock for this workflow.
  // +listType=atomic
  repeated MutexHolding holding = 1 [(gogoproto.customname) = "Holding", (gogoproto.nullable) = false];

  // Waiting is a list of mutexes and their respective objects this workflow is waiting for.
  // +listType=atomic
  repeated MutexHolding waiting = 2 [(gogoproto.customname) = "Waiting", (gogoproto.nullable) = false];
}

message NodeFlag {
  // Hooked tracks whether or not this node was triggered by hook or onExit
  optional bool hooked = 1 [(gogoproto.customname) = "Hooked", (gogoproto.nullable) = false];

  // Retried tracks whether or not this node was retried by retryStrategy
  optional bool retried = 2 [(gogoproto.customname) = "Retried", (gogoproto.nullable) = false];
}

message NodeResult {
  optional string phase = 1 [(gogoproto.casttype) = "NodePhase", (gogoproto.customname) = "Phase", (gogoproto.nullable) = false];

  optional string message = 2 [(gogoproto.customname) = "Message", (gogoproto.nullable) = false];

  optional Outputs outputs = 3 [(gogoproto.customname) = "Outputs"];

  optional string progress = 4 [(gogoproto.casttype) = "Progress", (gogoproto.customname) = "Progress", (gogoproto.nullable) = false];
}

// NodeStatus contains status information about an individual node in the workflow
message NodeStatus {
  // ID is a unique identifier of a node within the worklow
  // It is implemented as a hash of the node name, which makes the ID deterministic
  optional string id = 1 [(gogoproto.customname) = "ID", (gogoproto.nullable) = false];

  // Name is unique name in the node tree used to generate the node ID
  optional string name = 2 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // DisplayName is a human readable representation of the node. Unique within a template boundary
  optional string displayName = 3 [(gogoproto.customname) = "DisplayName", (gogoproto.nullable) = false];

  // Type indicates type of node
  optional string type = 4 [(gogoproto.casttype) = "NodeType", (gogoproto.customname) = "Type", (gogoproto.nullable) = false];

  // TemplateName is the template name which this node corresponds to.
  // Not applicable to virtual nodes (e.g. Retry, StepGroup)
  optional string templateName = 5 [(gogoproto.customname) = "TemplateName", (gogoproto.nullable) = false];

  // TemplateRef is the reference to the template resource which this node corresponds to.
  // Not applicable to virtual nodes (e.g. Retry, StepGroup)
  optional TemplateRef templateRef = 6 [(gogoproto.customname) = "TemplateRef"];

  // TemplateScope is the template scope in which the template of this node was retrieved.
  optional string templateScope = 20 [(gogoproto.customname) = "TemplateScope", (gogoproto.nullable) = false];

  // Phase a simple, high-level summary of where the node is in its lifecycle.
  // Can be used as a state machine.
  // Will be one of these values "Pending", "Running" before the node is completed, or "Succeeded",
  // "Skipped", "Failed", "Error", or "Omitted" as a final state.
  optional string phase = 7 [(gogoproto.casttype) = "NodePhase", (gogoproto.customname) = "Phase", (gogoproto.nullable) = false];

  // BoundaryID indicates the node ID of the associated template root node in which this node belongs to
  optional string boundaryID = 8 [(gogoproto.customname) = "BoundaryID", (gogoproto.nullable) = false];

  // A human readable message indicating details about why the node is in this condition.
  optional string message = 9 [(gogoproto.customname) = "Message", (gogoproto.nullable) = false];

  // Time at which this node started
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time startedAt = 10 [(gogoproto.customname) = "StartedAt", (gogoproto.nullable) = false];

  // Time at which this node completed
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time finishedAt = 11 [(gogoproto.customname) = "FinishedAt", (gogoproto.nullable) = false];

  // EstimatedDuration in seconds.
  optional int64 estimatedDuration = 24 [(gogoproto.casttype) = "EstimatedDuration", (gogoproto.customname) = "EstimatedDuration", (gogoproto.nullable) = false];

  // Progress to completion
  optional string progress = 26 [(gogoproto.casttype) = "Progress", (gogoproto.customname) = "Progress", (gogoproto.nullable) = false];

  // ResourcesDuration is indicative, but not accurate, resource duration. This is populated when the nodes completes.
  map<string, int64> resourcesDuration = 21 [(gogoproto.castkey) = "k8s.io/api/core/v1.ResourceName", (gogoproto.casttype) = "ResourcesDuration", (gogoproto.castvalue) = "ResourceDuration", (gogoproto.customname) = "ResourcesDuration", (gogoproto.nullable) = false];

  // PodIP captures the IP of the pod for daemoned steps
  optional string podIP = 12 [(gogoproto.customname) = "PodIP", (gogoproto.nullable) = false];

  // Daemoned tracks whether or not this node was daemoned and need to be terminated
  optional bool daemoned = 13 [(gogoproto.customname) = "Daemoned"];

  // NodeFlag tracks some history of node. e.g.) hooked, retried, etc.
  optional NodeFlag nodeFlag = 27 [(gogoproto.customname) = "NodeFlag"];

  // Inputs captures input parameter values and artifact locations supplied to this template invocation
  optional Inputs inputs = 14 [(gogoproto.customname) = "Inputs"];

  // Outputs captures output parameter values and artifact locations produced by this template invocation
  optional Outputs outputs = 15 [(gogoproto.customname) = "Outputs"];

  // Children is a list of child node IDs
  repeated string children = 16 [(gogoproto.customname) = "Children"];

  // OutboundNodes tracks the node IDs which are considered "outbound" nodes to a template invocation.
  // For every invocation of a template, there are nodes which we considered as "outbound". Essentially,
  // these are last nodes in the execution sequence to run, before the template is considered completed.
  // These nodes are then connected as parents to a following step.
  //
  // In the case of single pod steps (i.e. container, script, resource templates), this list will be nil
  // since the pod itself is already considered the "outbound" node.
  // In the case of DAGs, outbound nodes are the "target" tasks (tasks with no children).
  // In the case of steps, outbound nodes are all the containers involved in the last step group.
  // NOTE: since templates are composable, the list of outbound nodes are carried upwards when
  // a DAG/steps template invokes another DAG/steps template. In other words, the outbound nodes of
  // a template, will be a superset of the outbound nodes of its last children.
  repeated string outboundNodes = 17 [(gogoproto.customname) = "OutboundNodes"];

  // HostNodeName name of the Kubernetes node on which the Pod is running, if applicable
  optional string hostNodeName = 22 [(gogoproto.customname) = "HostNodeName", (gogoproto.nullable) = false];

  // MemoizationStatus holds information about cached nodes
  optional MemoizationStatus memoizationStatus = 23 [(gogoproto.customname) = "MemoizationStatus"];

  // SynchronizationStatus is the synchronization status of the node
  optional NodeSynchronizationStatus synchronizationStatus = 25 [(gogoproto.customname) = "SynchronizationStatus"];

  // TaskResultSynced is used to determine if the node's output has been received
  optional bool taskResultSynced = 28 [(gogoproto.customname) = "TaskResultSynced"];

  // FailedPodRestarts tracks the number of times the pod for this node was restarted
  // due to infrastructure failures before the main container started.
  optional int32 failedPodRestarts = 29 [(gogoproto.customname) = "FailedPodRestarts", (gogoproto.nullable) = false];

  // RestartingPodUID tracks the UID of the pod that is currently being restarted.
  // This prevents duplicate restart attempts when the controller processes the same failed pod multiple times.
  // Cleared when the replacement pod starts running.
  optional string restartingPodUID = 30 [(gogoproto.customname) = "RestartingPodUID", (gogoproto.nullable) = false];
}

// NodeSynchronizationStatus stores the status of a node
message NodeSynchronizationStatus {
  // Waiting is the name of the lock that this node is waiting for
  optional string waiting = 1 [(gogoproto.customname) = "Waiting", (gogoproto.nullable) = false];
}

// NoneStrategy indicates to skip tar process and upload the files or directory tree as independent
// files. Note that if the artifact is a directory, the artifact driver must support the ability to
// save/load the directory appropriately.
message NoneStrategy {
}

// OAuth2Auth holds all information for client authentication via OAuth2 tokens
message OAuth2Auth {
  optional .k8s.io.api.core.v1.SecretKeySelector clientIDSecret = 1 [(gogoproto.customname) = "ClientIDSecret"];

  optional .k8s.io.api.core.v1.SecretKeySelector clientSecretSecret = 2 [(gogoproto.customname) = "ClientSecretSecret"];

  optional .k8s.io.api.core.v1.SecretKeySelector tokenURLSecret = 3 [(gogoproto.customname) = "TokenURLSecret"];

  repeated string scopes = 5 [(gogoproto.customname) = "Scopes"];

  repeated OAuth2EndpointParam endpointParams = 6 [(gogoproto.customname) = "EndpointParams", (gogoproto.nullable) = false];
}

// OAuth2EndpointParam is an optional field that should be sent in the OAuth request.
message OAuth2EndpointParam {
  // Name is the header name
  optional string key = 1 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];

  // Value is the literal value to use for the header
  optional string value = 2 [(gogoproto.customname) = "Value", (gogoproto.nullable) = false];
}

// OSSArtifact is the location of an Alibaba Cloud OSS artifact
message OSSArtifact {
  optional OSSBucket oSSBucket = 1 [(gogoproto.customname) = "OSSBucket", (gogoproto.nullable) = false];

  // Key is the path in the bucket where the artifact resides
  optional string key = 2 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];
}

// OSSArtifactRepository defines the controller configuration for an OSS artifact repository
message OSSArtifactRepository {
  optional OSSBucket oSSBucket = 1 [(gogoproto.customname) = "OSSBucket", (gogoproto.nullable) = false];

  // KeyFormat defines the format of how to store keys and can reference workflow variables.
  optional string keyFormat = 2 [(gogoproto.customname) = "KeyFormat", (gogoproto.nullable) = false];
}

// OSSBucket contains the access information required for interfacing with an Alibaba Cloud OSS bucket
message OSSBucket {
  // Endpoint is the hostname of the bucket endpoint
  optional string endpoint = 1 [(gogoproto.customname) = "Endpoint", (gogoproto.nullable) = false];

  // Bucket is the name of the bucket
  optional string bucket = 2 [(gogoproto.customname) = "Bucket", (gogoproto.nullable) = false];

  // AccessKeySecret is the secret selector to the bucket's access key
  optional .k8s.io.api.core.v1.SecretKeySelector accessKeySecret = 3 [(gogoproto.customname) = "AccessKeySecret"];

  // SecretKeySecret is the secret selector to the bucket's secret key
  optional .k8s.io.api.core.v1.SecretKeySelector secretKeySecret = 4 [(gogoproto.customname) = "SecretKeySecret"];

  // CreateBucketIfNotPresent tells the driver to attempt to create the OSS bucket for output artifacts, if it doesn't exist
  optional bool createBucketIfNotPresent = 5 [(gogoproto.customname) = "CreateBucketIfNotPresent", (gogoproto.nullable) = false];

  // SecurityToken is the user's temporary security token. For more details, check out: https://www.alibabacloud.com/help/doc-detail/100624.htm
  optional string securityToken = 6 [(gogoproto.customname) = "SecurityToken", (gogoproto.nullable) = false];

  // LifecycleRule specifies how to manage bucket's lifecycle
  optional OSSLifecycleRule lifecycleRule = 7 [(gogoproto.customname) = "LifecycleRule"];

  // UseSDKCreds tells the driver to figure out credentials based on sdk defaults.
  optional bool useSDKCreds = 8 [(gogoproto.customname) = "UseSDKCreds", (gogoproto.nullable) = false];
}

// OSSLifecycleRule specifies how to manage bucket's lifecycle
message OSSLifecycleRule {
  // MarkInfrequentAccessAfterDays is the number of days before we convert the objects in the bucket to Infrequent Access (IA) storage type
  optional int32 markInfrequentAccessAfterDays = 1 [(gogoproto.customname) = "MarkInfrequentAccessAfterDays", (gogoproto.nullable) = false];

  // MarkDeletionAfterDays is the number of days before we delete objects in the bucket
  optional int32 markDeletionAfterDays = 2 [(gogoproto.customname) = "MarkDeletionAfterDays", (gogoproto.nullable) = false];
}

// Object represents a JSON object value.
// +kubebuilder:validation:Type=object
message Object {
  optional bytes value = 1 [(gogoproto.casttype) = "encoding/json.RawMessage", (gogoproto.customname) = "Value"];
}

// Outputs hold parameters, artifacts, and results from a step
message Outputs {
  // Parameters holds the list of output parameters produced by a step
  // +patchStrategy=merge
  // +patchMergeKey=name
  repeated Parameter parameters = 1 [(gogoproto.customname) = "Parameters", (gogoproto.nullable) = false];

  // Artifacts holds the list of output artifacts produced by a step
  // +patchStrategy=merge
  // +patchMergeKey=name
  repeated Artifact artifacts = 2 [(gogoproto.customname) = "Artifacts", (gogoproto.nullable) = false];

  // Result holds the result (stdout) of a script or container template, or the response body of an HTTP template
  optional string result = 3 [(gogoproto.customname) = "Result"];

  // ExitCode holds the exit code of a script template
  optional string exitCode = 4 [(gogoproto.customname) = "ExitCode"];
}

// ParallelSteps is a list of workflow steps that run in parallel.
// swagger:ignore
message ParallelSteps {
  // Note: the `json:"steps"` part exists to workaround kubebuilder limitations.
  // There isn't actually a "steps" key in the JSON serialization; this is an anonymous list.
  // See the custom Unmarshaller below and ./hack/manifests/crd.go
  repeated WorkflowStep steps = 1 [(gogoproto.customname) = "Steps", (gogoproto.nullable) = false];
}

// Parameter indicate a passed string parameter to a service template with an optional default value
message Parameter {
  // Name is the parameter name
  // +kubebuilder:validation:Pattern=`^[-a-zA-Z0-9_]+$`
  optional string name = 1 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Default is the default value to use for an input parameter if a value was not supplied
  optional string default = 2 [(gogoproto.casttype) = "AnyString", (gogoproto.customname) = "Default"];

  // Value is the literal value to use for the parameter.
  // If specified in the context of an input parameter, any passed values take precedence over the specified value
  optional string value = 3 [(gogoproto.casttype) = "AnyString", (gogoproto.customname) = "Value"];

  // ValueFrom is the source for the output parameter's value
  optional ValueFrom valueFrom = 4 [(gogoproto.customname) = "ValueFrom"];

  // GlobalName exports an output parameter to the global scope, making it available as
  // workflow.outputs.parameters.XXXX and in workflow.status.outputs.parameters
  optional string globalName = 5 [(gogoproto.customname) = "GlobalName", (gogoproto.nullable) = false];

  // Enum holds a list of string values to choose from, for the actual value of the parameter
  // +kubebuilder:validation:MinItems=1
  repeated string enum = 6 [(gogoproto.casttype) = "AnyString", (gogoproto.customname) = "Enum"];

  // Description is the parameter description
  optional string description = 7 [(gogoproto.casttype) = "AnyString", (gogoproto.customname) = "Description"];
}

// Plugin is an Object with exactly one key
message Plugin {
  // +kubebuilder:pruning:PreserveUnknownFields
  optional Object object = 1 [(gogoproto.customname) = "Object", (gogoproto.nullable) = false];
}

// PluginArtifact is the location of a plugin artifact
message PluginArtifact {
  // Name is the name of the artifact driver plugin
  optional string name = 1 [(gogoproto.casttype) = "ArtifactPluginName", (gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Configuration is the plugin defined configuration for the artifact driver plugin
  optional string configuration = 2 [(gogoproto.customname) = "Configuration", (gogoproto.nullable) = false];

  // ConnectionTimeoutSeconds is the timeout for the artifact driver connection, overriding the driver's timeout
  optional int32 connectionTimeoutSeconds = 3 [(gogoproto.customname) = "ConnectionTimeoutSeconds", (gogoproto.nullable) = false];

  // Key is the path in the artifact repository where the artifact resides
  optional string key = 4 [(gogoproto.customname) = "Key", (gogoproto.nullable) = false];
}

// PluginArtifactRepository defines the controller configuration for a plugin artifact repository
message PluginArtifactRepository {
  optional string name = 1 [(gogoproto.casttype) = "ArtifactPluginName", (gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  optional string keyFormat = 2 [(gogoproto.customname) = "KeyFormat", (gogoproto.nullable) = false];

  optional string configuration = 3 [(gogoproto.customname) = "Configuration", (gogoproto.nullable) = false];
}

// PodGC describes how to delete completed pods as they complete
message PodGC {
  // Strategy is the strategy to use. One of "OnPodCompletion", "OnPodSuccess", "OnWorkflowCompletion", "OnWorkflowSuccess". If unset, does not delete Pods
  optional string strategy = 1 [(gogoproto.casttype) = "PodGCStrategy", (gogoproto.customname) = "Strategy", (gogoproto.nullable) = false];

  // LabelSelector is the label selector to check if the pods match the labels before being added to the pod GC queue.
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.LabelSelector labelSelector = 2 [(gogoproto.customname) = "LabelSelector"];

  // DeleteDelayDuration specifies the duration before pods in the GC queue get deleted.
  optional string deleteDelayDuration = 3 [(gogoproto.customname) = "DeleteDelayDuration", (gogoproto.nullable) = false];
}

// Prometheus is a prometheus metric to be emitted
message Prometheus {
  // Name is the name of the metric
  // +kubebuilder:validation:Pattern=`^[a-zA-Z_][a-zA-Z0-9_]*$`
  optional string name = 1 [(gogoproto.customname) = "Name", (gogoproto.nullable) = false];

  // Labels is a list of metric labels
  repeated MetricLabel labels = 2 [(gogoproto.customname) = "Labels"];

  // Help is a string that describes the metric
  // +kubebuilder:validation:MinLength=1
  optional string help = 3 [(gogoproto.customname) = "Help", (gogoproto.nullable) = false];

  // When is a conditional statement that decides when to emit the metric
  optional string when = 4 [(gogoproto.customname) = "When", (gogoproto.nullable) = false];

  // Gauge is a gauge metric
  optional Gauge gauge = 5 [(gogoproto.customname) = "Gauge"];

  // Histogram is a histogram metric
  optional Histogram histogram = 6 [(gogoproto.customname) = "Histogram"];

  // Counter is a counter metric
  optional Counter counter = 7 [(gogoproto.customname) = "Counter"];
}

// RawArtifact allows raw string content to be placed as an artifact in a container
message RawArtifact {
  // Data is the string contents of the artifact
  optional string data = 1 [(gogoproto.customname) = "Data", (gogoproto.nullable) = false];
}

// ResourceTemplate is a template subtype to manipulate kubernetes resources
// +kubebuilder:validation:XValidation:rule="(has(self.manifest) && !has(self.manifestFrom)) || (!has(self.manifest) && has(self.manifestFrom)) || (!has(self.manifest) && !has(self.manifestFrom))",message="only one of manifest or manifestFrom can be specified"
message ResourceTemplate {
  // Action is the action to perform to the resource.
  // Must be one of: get, create, apply, delete, replace, patch
  // +kubebuilder:validation:Enum=get;create;apply;delete;replace;patch
  optional string action = 1 [(gogoproto.customname) = "Action", (gogoproto.nullable) = false];

  // MergeStrategy is the strategy used to merge a patch. It defaults to "strategic"
  // Must be one of: strategic, merge, json
  // +kubebuilder:validation:Enum=strategic;merge;json
  optional string mergeStrategy = 2 [(gogoproto.customname) = "MergeStrategy", (gogoproto.nullable) = false];

  // Manifest contains the kubernetes manifest
  optional string manifest = 3 [(gogoproto.customname) = "Manifest", (gogoproto.nullable) = false];

  // ManifestFrom is the source for a single kubernetes manifest
  optional ManifestFrom manifestFrom = 8 [(gogoproto.customname) = "ManifestFrom"];

  // SetOwnerReference sets the reference to the workflow on the OwnerReference of generated resource.
  optional bool setOwnerReference = 4 [(gogoproto.customname) = "SetOwnerReference", (gogoproto.nullable) = false];

  // SuccessCondition is a label selector expression which describes the conditions
  // of the k8s resource in which it is acceptable to proceed to the following step
  optional string successCondition = 5 [(gogoproto.customname) = "SuccessCondition", (gogoproto.nullable) = false];

  // FailureCondition is a label selector expression which describes the conditions
  // of the k8s resource in which the step was considered failed
  optional string failureCondition = 6 [(gogoproto.customname) = "FailureCondition", (gogoproto.nullable) = false];

  // Flags is a set of additional options passed to kubectl before submitting a resource
  // I.e. to disable resource validation:
  // flags: [
  // 	"--validate=false"  # disable resource validation
  // ]
  repeated string flags = 7 [(gogoproto.customname) = "Flags"];
}

// RetryAffinity prevents running steps on the same host.
message RetryAffinity {
  optional RetryNodeAntiAffinity nodeAntiAffinity = 1 [(gogoproto.customname) = "NodeAntiAffinity"];
}

// RetryNodeAntiAffinity is a placeholder for future expansion, only empty nodeAntiAffinity is allowed.
// In order to prevent running steps on the same host, it uses "kubernetes.io/hostname".
message RetryNodeAntiAffinity {
}

// RetryStrategy provides controls on how to retry a workflow step
message RetryStrategy {
  // Limit is the maximum number of retry attempts when retrying a container. It does not include the original
  // container; the maximum number of total attempts will be `limit + 1`.
  optional .k8s.io.apimachinery.pkg.util.intstr.IntOrString limit = 1 [(gogoproto.customname) = "Limit"];

  // RetryPolicy is a policy of NodePhase statuses that will be retried
  optional string retryPolicy = 2 [(gogoproto.casttype) = "RetryPolicy", (gogoproto.customname) = "RetryPolicy", (gogoproto.nullable) = false];

  // Backoff is a backoff strategy
  optional Backoff backoff = 3 [(gogoproto.casttype) = "Backoff", (gogoproto.customname) = "Backoff"];

  // Affinity prevents running workflow's step on the same host
  optional RetryAffinity affinity = 4 [(gogoproto.customname) = "Affinity"];

  // Expression is a condition expression for when a node will be retried. If it evaluates to false, the node will not
  // be retried and the retry strategy will be ignored
  optional string expression = 5 [(gogoproto.customname) = "Expression", (gogoproto.nullable) = false];
}

// S3Artifact is the location of an S3 artifact
message S3Artifact {
  optional S3Bucket s3Bucket = 1 [(gogoproto.customname) = "S3Bucket", (gogoproto.nullable) = false];

  // Key is the key in the bucket where the artifact resides
