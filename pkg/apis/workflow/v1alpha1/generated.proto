  optional string schedulerName = 21 [(gogoproto.customname) = "SchedulerName", (gogoproto.nullable) = false];

  // PodGC describes the strategy to use when deleting completed pods
  optional PodGC podGC = 22 [(gogoproto.customname) = "PodGC"];

  // PriorityClassName to apply to workflow pods.
  optional string podPriorityClassName = 23 [(gogoproto.customname) = "PodPriorityClassName", (gogoproto.nullable) = false];

  // +patchStrategy=merge
  // +patchMergeKey=ip
  repeated .k8s.io.api.core.v1.HostAlias hostAliases = 25 [(gogoproto.customname) = "HostAliases", (gogoproto.nullable) = false];

  // SecurityContext holds pod-level security attributes and common container settings.
  // Optional: Defaults to empty.  See type description for default values of each field.
