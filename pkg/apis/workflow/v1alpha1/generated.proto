  // +optional
  optional .k8s.io.api.policy.v1.PodDisruptionBudgetSpec podDisruptionBudget = 31 [(gogoproto.customname) = "PodDisruptionBudget"];

  // Metrics are a list of metrics emitted from this Workflow
  optional Metrics metrics = 32 [(gogoproto.customname) = "Metrics"];

  // Shutdown will shutdown the workflow according to its ShutdownStrategy
  optional string shutdown = 33 [(gogoproto.casttype) = "ShutdownStrategy", (gogoproto.customname) = "Shutdown", (gogoproto.nullable) = false];

  // WorkflowTemplateRef holds a reference to a WorkflowTemplate for execution
  optional WorkflowTemplateRef workflowTemplateRef = 34 [(gogoproto.customname) = "WorkflowTemplateRef"];

  // Synchronization holds synchronization lock configuration for this Workflow
  optional Synchronization synchronization = 35 [(gogoproto.casttype) = "Synchronization", (gogoproto.customname) = "Synchronization"];

  // VolumeClaimGC describes the strategy to use when deleting volumes from completed workflows
  optional VolumeClaimGC volumeClaimGC = 36 [(gogoproto.casttype) = "VolumeClaimGC", (gogoproto.customname) = "VolumeClaimGC"];

  // RetryStrategy for all templates in the workflow.
  optional RetryStrategy retryStrategy = 37 [(gogoproto.customname) = "RetryStrategy"];

  // PodMetadata defines additional metadata that should be applied to workflow pods
  optional Metadata podMetadata = 38 [(gogoproto.customname) = "PodMetadata"];

  // TemplateDefaults holds default template values that will apply to all templates in the Workflow, unless overridden on the template-level
  optional Template templateDefaults = 39 [(gogoproto.customname) = "TemplateDefaults"];

  // ArchiveLogs indicates if the container logs should be archived
  optional bool archiveLogs = 40 [(gogoproto.customname) = "ArchiveLogs"];

  // Hooks holds the lifecycle hook which is invoked at lifecycle of
